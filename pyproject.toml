[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crp-online"
version = "0.1.0"
description = "Python reproduction of GP-designed relocation rules for the online container relocation problem (Durasevic, Dumic & Gil-Gala, 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest"]
# LLM phase only. EoH v0.2 pinned to an exact commit (not on PyPI).
llm = ["eoh @ git+https://github.com/FeiLiu36/EoH@472545785c936dcfc863d2bc0d6109cf23c7ce62#subdirectory=eoh"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
