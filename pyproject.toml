[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crp-online"
version = "0.1.0"
description = "Python reproduction of GP-designed relocation rules for the online container relocation problem (Durasevic, Dumic & Gil-Gala, 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest"]
# LLM phase only (EoH and ReEvo themselves come from frameworks/setup_reevo.sh).
llm = ["numpy"]  # available to LLM-written rules as np
plot = ["matplotlib"]  # result figures only

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
