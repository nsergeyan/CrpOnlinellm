[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crp-online"
version = "0.1.0"
description = "Python reproduction of GP-designed relocation rules for the online container relocation problem (Durasevic, Dumic & Gil-Gala, 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
